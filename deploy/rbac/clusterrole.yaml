apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provenance-enforcer-role
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devsecops.licenta.ro"]
    resources: ["zerotrustapplications", "zerotrustapplications/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["devsecops.licenta.ro"]
    resources: ["supplychainattestations"]
    verbs: ["get", "list", "watch"]
