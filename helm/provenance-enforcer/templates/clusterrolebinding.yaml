apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "provenance-enforcer.name" . }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "provenance-enforcer.name" . }}
    namespace: {{ include "provenance-enforcer.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "provenance-enforcer.name" . }}-role
  apiGroup: rbac.authorization.k8s.io