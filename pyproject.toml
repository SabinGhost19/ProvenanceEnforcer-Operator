[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-enforcer"
version = "0.1.0"
description = "Voucher-Based Build Integrity provenance verifier for ZeroTrustApplication"
requires-python = ">=3.11"
dependencies = [
  "kopf==1.37.4",
  "kubernetes==30.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]